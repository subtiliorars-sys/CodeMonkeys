name: Secrets Scan

# Static secret/vulnerability scanning on every push and PR.
# Additive — does NOT modify existing ci.yml / kanban-autolabel.yml jobs.
# Uses Gitleaks (fast, allowlist-aware) so known-safe patterns in this repo
# do not produce false positives.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to diff

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Fail the job only on findings NOT in .gitleaks.toml allowlist.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
